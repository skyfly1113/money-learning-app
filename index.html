<body class="bg-amber-50 text-slate-800 min-h-screen overflow-x-hidden selection:bg-pink-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // --- Web Audio Synthesizer Engine ---
    const AudioEngine = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) this.ctx = new AudioContextClass();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      },
      playCoin() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc1 = this.ctx.createOscillator();
        const osc2 = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc1.type = 'sine';
        osc2.type = 'triangle';
        osc1.frequency.setValueAtTime(1400, now);
        osc1.frequency.exponentialRampToValueAtTime(2400, now + 0.12);
        osc2.frequency.setValueAtTime(2800, now);
        osc2.frequency.exponentialRampToValueAtTime(3600, now + 0.12);

        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);

        osc1.connect(gain);
        osc2.connect(gain);
        gain.connect(this.ctx.destination);

        osc1.start(now);
        osc2.start(now);
        osc1.stop(now + 0.22);
        osc2.stop(now + 0.22);
      },
      playBill() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const bufferSize = this.ctx.sampleRate * 0.12;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const output = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          output[i] = Math.random() * 2 - 1;
        }
        const whiteNoise = this.ctx.createBufferSource();
        whiteNoise.buffer = buffer;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1500, now);
        filter.Q.setValueAtTime(2.5, now);

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);

        whiteNoise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);

        whiteNoise.start(now);
      },
      playSuccess() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.value = freq;
          const startTime = now + idx * 0.08;
          gain.gain.setValueAtTime(0, startTime);
          gain.gain.linearRampToValueAtTime(0.3, startTime + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.35);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(startTime);
          osc.stop(startTime + 0.35);
        });
      },
      playTryAgain() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(392, now); // G4
        osc.frequency.exponentialRampToValueAtTime(329.63, now + 0.25); // E4
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.28);
      }
    };

    // --- Text-to-Speech Helper ---

      const utterance = new SpeechSynthesisUtterance(text);

                </button>

                <button
                  onClick={() => setIsParentModalOpen(true)}
                  className="px-3 py-1.5 bg-slate-800 hover:bg-slate-900 text-white font-bold text-xs rounded-xl shadow transition-all"
                >
                  🔒 학부모
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-4xl mx-auto px-4 pt-6 space-y-6">
            {/* Helper & Theme Selector Switcher */}
            <div className="flex flex-wrap items-center justify-between bg-white/70 p-3 rounded-2xl border-2 border-amber-200 gap-2">
              <div className="flex items-center space-x-2">
                <span className="text-xs font-bold text-slate-500">도우미:</span>
                <button
                  onClick={() => setCharacter('dondoni')}
                  className={`px-3 py-1 rounded-xl text-xs font-bold transition-all ${character === 'dondoni' ? 'bg-pink-400 text-white shadow' : 'bg-white text-slate-600'}`}
                >
                  🐷 돈돈이
                </button>
                <button
                  onClick={() => setCharacter('tori')}
                  className={`px-3 py-1 rounded-xl text-xs font-bold transition-all ${character === 'tori' ? 'bg-amber-500 text-white shadow' : 'bg-white text-slate-600'}`}
                >
                  🐿️ 토리
                </button>
              </div>

              <div className="flex items-center space-x-2">
                <span className="text-xs font-bold text-slate-500">가게 배경:</span>
                {[
                  { id: 'toy', label: '🧸 장난감' },
                  { id: 'fruit', label: '🍎 과일' },
                  { id: 'bakery', label: '🍞 빵집' },
                  { id: 'icecream', label: '🍦 아이스크림' },
                ].map((item) => (
                  <button
                    key={item.id}
                    onClick={() => setTheme(item.id)}
                    className={`px-2.5 py-1 rounded-xl text-xs font-bold transition-all ${
                      theme === item.id ? 'bg-amber-800 text-white shadow' : 'bg-white text-slate-600'
                    }`}
                  >
                    {item.label}
                  </button>
                ))}
              </div>
            </div>

            {/* Stage Selector Tabs */}
            <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
              {[
                { id: 1, title: '1단계: 화폐 알아보기', icon: '🪙', color: 'bg-pink-500' },
                { id: 2, title: '2단계: 모아 세기', icon: '🚆', color: 'bg-sky-500' },
                { id: 3, title: '3단계: 알뜰 장보기', icon: '🛒', color: 'bg-emerald-500' },
                { id: 'room', title: '마이룸 꾸미기', icon: '🛋️', color: 'bg-purple-500' },
              ].map((tab) => {
                const isActive = currentStage === tab.id;
                return (
                  <button
                    key={tab.id}
                    onClick={() => setCurrentStage(tab.id)}
                    className={`p-3 rounded-2xl font-bold flex flex-col items-center justify-center space-y-1 shadow-md transition-all active:scale-95 ${
                      isActive 
                        ? `${tab.color} text-white ring-4 ring-white` 
                        : 'bg-white text-slate-700 hover:bg-slate-50'
                    }`}
                  >
                    <span className="text-2xl">{tab.icon}</span>
                    <span className="text-sm leading-tight text-center">{tab.title}</span>
                  </button>
                );
              })}
            </div>

            {/* Stage Content Render */}
            <div className="mt-4">
              {currentStage === 1 && (
                <Stage1 
                  onSuccess={handleStageSuccess} 
                  character={character} 
                  audioEnabled={audioEnabled} 
                />
              )}
              {currentStage === 2 && (
                <Stage2 
                  onSuccess={handleStageSuccess} 
                  character={character} 
                  audioEnabled={audioEnabled} 
                />
              )}
              {currentStage === 3 && (
                <Stage3 
                  onSuccess={handleStageSuccess} 
                  character={character} 
                  audioEnabled={audioEnabled}
                  theme={theme}
                />
              )}
              {currentStage === 'room' && (
                <MyRoom 
                  coins={happyCoins} 
                  onSpend={handleSpendCoins} 
                  character={character} 
                />
              )}
            </div>
          </main>

          {/* Parent Report Modal */}
          <ParentReportModal 
            isOpen={isParentModalOpen} 
            onClose={() => setIsParentModalOpen(false)} 
            stats={{ solvedCount, totalCoins: happyCoins }}
          />
        </div>
      );
    };

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
